
name: Build Blocky Platformer APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CYTHON_LANGUAGE_LEVEL: "3"
  PYTHONUNBUFFERED: "1"
  USE_COLORS: "0"

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout project
      uses: actions/checkout@v5

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Linux dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          autoconf automake libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          libltdl-dev \
          libc6-i386 lib32stdc++6 lib32z1 \
          build-essential

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer
        pip install cython==0.29.33

    - name: Accept Android SDK licenses
      run: |
        mkdir -p "$HOME/.buildozer"
        touch "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"

    - name: Check environment
      run: |
        java -version
        python --version
        cython --version
        buildozer --version

    - name: Build Android APK
      id: build
      continue-on-error: true
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee buildozer.log

    - name: Create 200-line error log
      if: always()
      run: |
        if [ -f buildozer.log ]; then
          tail -n 200 buildozer.log > build-error.log
        else
          echo "Buildozer log was not created." > build-error.log
        fi

        echo "========== LAST 200 LINES =========="
        cat build-error.log
        echo "===================================="

    - name: Upload 200-line error log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: Build-Error-200-Lines
        path: build-error.log
        retention-days: 7

    - name: Upload complete build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: Complete-Build-Log
        path: buildozer.log
        if-no-files-found: ignore
        retention-days: 3

    - name: Upload APK
      if: success() || steps.build.outcome == 'success'
      uses: actions/upload-artifact@v6
      with:
        name: Blocky-Platformer-APK
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Report build result
      if: always()
      run: |
        if [ "${{ steps.build.outcome }}" = "success" ]; then
          echo "APK build completed."
        else
          echo "APK build failed. Download Build-Error-200-Lines."
          exit 1
        fi
