
name: Build Blocky Platformer APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CYTHON_LANGUAGE_LEVEL: "3"
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  USE_COLORS: "0"

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout project
      uses: actions/checkout@v5

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Linux dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          autoconf automake libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          libltdl-dev \
          libc6-i386 lib32stdc++6 lib32z1 \
          build-essential

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer
        pip install cython==0.29.33

    - name: Configure Android SDK license
      run: |
        sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec

    - name: Check environment
      run: |
        java -version
        python --version
        cython --version
        buildozer --version

    - name: Build Android APK
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee buildozer.log

    - name: Find APK
      if: always()
      id: check-build
      run: |
        if find bin -maxdepth 1 -name "*.apk" -print -quit | grep -q .; then
          echo "BUILD_SUCCESS=true" >> "$GITHUB_OUTPUT"
          ls -lh bin/*.apk
        else
          echo "BUILD_SUCCESS=false" >> "$GITHUB_OUTPUT"
          echo "APK was not generated."
        fi

    - name: Upload APK
      if: steps.check-build.outputs.BUILD_SUCCESS == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: Blocky-Platformer-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: Blocky-Platformer-Build-Logs
        path: buildozer.log
        if-no-files-found: ignore
        retention-days: 7
